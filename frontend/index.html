<!DOCTYPE html>
<html lang="uz" class="light">
  <head>
    <script>
      // Apply the saved theme synchronously, before first paint — avoids a
      // flash of the wrong theme while the app JS loads and hydrates.
      (function () {
        try {
          var raw = localStorage.getItem('marjona-auth');
          var theme = raw ? JSON.parse(raw).state.theme : 'light';
          document.documentElement.className = theme === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d4af37" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Marjona Med Servis" />
    <link rel="apple-touch-icon" href="/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Marjona Med Servis</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('marjona-auth')
          var data = stored ? JSON.parse(stored) : null
          var theme = (data && data.state && data.state.theme) ? data.state.theme : 'dark'
          document.documentElement.className = theme
        } catch (e) {
          document.documentElement.className = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
